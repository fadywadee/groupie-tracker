<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Groupie Tracker - Home</title>
</head>
<body>
    <h1>The Artists</h1>
    <div class="artists-grid">
        {{range .}}
        <div class="artist-card">
            <img src="{{.Image}}" alt="{{.Name}}" width="200">
            <h2>{{.Name}}</h2>
            
            <a href="/artist?id={{.ID}}">View Details</a>
        </div>
        {{end}}
    </div>
</body>
</html>
